.small{font-size:13px;line-height:1.7;color:var(--mut)}

function nowStrL(){var d=new Date();return tdy()+' '+pad(d.getHours())+':'+pad(d.getMinutes());}
function nowML(){var d=new Date();return d.getHours()*60+d.getMinutes();}
function hm2m(s){var p=String(s||'').split(':');return (+p[0])*60+(+p[1]||0);}
function m2hm(m){m=Math.max(0,Math.min(1439,m));return pad(Math.floor(m/60))+':'+pad(m%60);}
function msOf(s){var p=String(s).split(/[- :]/);return new Date(+p[0],+p[1]-1,+p[2],+p[3]||0,+p[4]||0).getTime();}
function minsB(a,b){return Math.max(0,Math.round((msOf(b)-msOf(a))/60000));}
function workM(x,upto){if(!x.start)return 0;var p=0;(x.pauses||[]).forEach(function(z){if(z.f)p+=minsB(z.f,z.t||upto);});return Math.max(0,minsB(x.start,upto)-p);}
function locN(l){return LANG==='en'?(LOC_EN[l]||l):l;}
function tN(x){return LANG==='en'&&x.en?x.en:x.name;}
function dur(m){m=Math.round(Number(m)||0);var h=Math.floor(m/60),mm=m%60;return LANG==='en'?(h?h+'h ':'')+mm+'m':(h?h+' மணி ':'')+mm+' நிமி';}

/* போனிலேயே உடனே மாற்றம் (offline) — Sheet-க்குப் பின்னணியில் */
function applyTask(R,fn,a){
 if(fn==='emergency'){var o=a[0],at=a[1]||nowStrL();if(o.key.slice(0,10)!==R.today||R.items.some(function(x){return x.key===o.key;}))return;
  R.items.forEach(function(x){if(x.st==='started'){x.st='paused';x.pauses=(x.pauses||[]).concat([{f:at,t:'',w:'⚡ '+o.name}]);}});
  R.items.push({key:o.key,tid:o.key.split('|')[1],name:'⚡ '+o.name,time:at.slice(11),ptime:at.slice(11),st:'started',start:at,end:'',mins:'',div:o.div,kind:'அவசரம்',emg:true,subs:[],subsDone:[],pauses:[],dur:0,loc:'',imp:false});return;}
 if(fn==='backlogAct'){var tid=a[0],b=null;(R.backlog||[]).forEach(function(z,i){if(z.tid===tid)b=R.backlog.splice(i,1)[0];});var at2=a[2]||nowStrL();
  if(b&&!R.items.some(function(x){return x.tid===tid;}))R.items.push({key:R.today+'|'+tid,tid:tid,name:b.name,en:b.en,time:at2.slice(11),ptime:at2.slice(11),st:'pending',div:b.div,loc:b.loc,dur:b.dur,imp:b.imp,backlog:true,subs:[],subsDone:[],pauses:[]});
  a=[R.today+'|'+tid,a[1],'',at2];fn='taskAct';}
 if(fn==='setCover'){var cm=a[1],cv={am:cm==='am'||cm==='day',pm:cm==='pm'||cm==='day'};if(a[0]===R.today)R.cover.today=cv;else if(a[0]===R.tomorrow)R.cover.tomorrow=cv;return;}
 if(fn==='markDone'){a=[R.today+'|ACC','done','',a[0]];fn='taskAct';}
 if(fn!=='taskAct')return;
 var key=a[0],act=a[1],arg=a[2],at=a[3]||nowStrL(),x=null;R.items.forEach(function(y){if(y.key===key)x=y;});if(!x)return;
 function close(){var p=x.pauses||[];if(p.length&&!p[p.length-1].t)p[p.length-1].t=at;}
 function begin(){if(x.st==='pending'||x.st==='missed'){x.start=at;x.late=Math.max(0,hm2m(at.slice(11))-hm2m(x.ptime||x.time));}}
 function fin(){if(x.st==='paused')close();if(!x.start)x.start=at;x.st='done';x.end=at;x.mins=workM(x,at);}
 if(act==='del'){if(x.emg)R.items.splice(R.items.indexOf(x),1);return;}
 // புதிய வேலை தொடங்கினால் நடக்கும் மற்றது தானாக ⏸
 if((act==='start'||act==='resume'||(act==='sub'&&/:1$/.test(String(arg))))&&x.st!=='done'&&x.st!=='started')
  R.items.forEach(function(z){if(z!==x&&z.st==='started'){z.st='paused';z.pauses=(z.pauses||[]).concat([{f:at,t:'',w:'→ '+x.name}]);}});
 if(act==='start'||act==='resume'){begin();if(x.st==='paused')close();if(x.st!=='done')x.st='started';}
 else if(act==='pause'){if(x.st==='started'){x.st='paused';x.pauses=(x.pauses||[]).concat([{f:at,t:'',w:arg}]);}}
 else if(act==='done'){if(x.st!=='done')fin();}
 else if(act==='sub'){var p=String(arg).split(':'),i=+p[0],v=p[1]==='1',sd=x.subsDone||(x.subsDone=[]),j=sd.indexOf(i);
  if(v&&j<0)sd.push(i);if(!v&&j>=0)sd.splice(j,1);
  if(v&&x.st!=='done'){begin();if(x.st==='paused')close();x.st='started';if(x.subs&&x.subs.length&&sd.length>=x.subs.length)fin();}}
 else if(act==='snooze'){if(x.st==='pending'||x.st==='missed'){x.st='pending';x.time=m2hm(hm2m(at.slice(11))+Math.max(5,+arg||30));}}
 else if(act==='move'){if(x.st==='pending'||x.st==='missed'){x.time=arg;x.ptime=arg;}}
 else if(act==='skip'||act==='tomorrow'){if(x.st!=='done'){x.st='skipped';x.end=at;x.note=act==='tomorrow'?'⏩ '+t('tmrwS'):arg;}}
 else if(act==='reset'){x.st='pending';x.start='';x.end='';x.mins='';x.note='';x.subsDone=[];x.pauses=[];}}
function conflictsL(items){var bl=items.filter(function(i){return i.cover&&!i.skip&&i.time;}).map(function(i){return {s:hm2m(i.time),e:hm2m(i.time)+(i.dur||0),name:i.name,en:i.en};});
 items.forEach(function(i){delete i.conflict;if(i.cover||i.skip||!i.time||i.st==='done')return;var s=hm2m(i.time);
  bl.forEach(function(z){if(!i.conflict&&s>=z.s&&s<z.e)i.conflict={name:z.name,en:z.en,to:m2hm(z.e)};});});}
function sortT(a,b){return (a.time||'99')<(b.time||'99')?-1:(a.time||'99')>(b.time||'99')?1:0;}
/* 🛵 பிரதீப் விடுப்பு — வருகிறார் / காலை / மாலை / முழு நாள் */
function covNorm(c){if(c===true)return {am:true,pm:true};if(!c||typeof c!=='object')return {am:false,pm:false};return {am:!!c.am,pm:!!c.pm};}
function covMode(c){c=covNorm(c);return c.am&&c.pm?'day':c.am?'am':c.pm?'pm':'none';}
function covRow(ds,c,lbl,act){var m=covMode(c);
 return '<div class="cov'+(m==='none'?'':' lv')+'"><div class="cq">🛵 '+esc(lbl)+'</div><div class="seg">'+[['none','cvNone'],['am','cvAm'],['pm','cvPm'],['day','cvAll']].map(function(o){
  return '<button class="'+(m===o[0]?'on':'')+'" data-act="'+act+'" data-d="'+ds+'" data-m="'+o[0]+'">'+t(o[1])+'</button>';}).join('')+'</div><div class="cs">'+t('cvS_'+m)+'</div></div>';}
function replay(r){var R=JSON.parse(JSON.stringify(r));qGet().forEach(function(q){if(q.fn)applyTask(R,q.fn,q.args);});R.items.sort(sortT);conflictsL(R.items);return R;}

 else h+='<button class="done" data-act="dnd">🔕 '+t('dndBtn')+'</button>';
 if(!R.planned.tomorrow&&nm>=19*60)h+='<div class="hint warn" data-act="plan" style="margin-top:10px">🌙 '+t('plNotYet')+' ›</div>';

 var nx=null;rest.forEach(function(x){if(!nx&&x.st==='pending'&&!isOver(x)&&x.time&&hm2m(x.time)+(x.dur||0)>=nm)nx=x.key;});

S.freeSkip={};
function freeSlot(R){var nm=nowML();if(R.empty||nm<240||nm>=1260||R.today!==tdy())return null;
 if(R.dnd&&R.dnd>Date.now())return null;
 if(R.items.some(function(x){return x.st==='started'&&!x.fill;}))return null;
 if(R.items.some(function(x){return x.st==='pending'&&!x.fill&&x.time&&hm2m(x.time)<=nm&&hm2m(x.time)+(x.dur||0)>nm;}))return null;
 var fillRun=null;R.items.forEach(function(x){if(x.st==='started'&&x.fill)fillRun=x;});
 var nb=1260;R.items.forEach(function(x){if(x.st!=='pending'||x.fill||!x.time)return;var s0=hm2m(x.time);if(s0>nm&&s0<nb)nb=s0;});
 var free=nb-nm,rk={'அமிர்தம் டெய்ரி':0,'நலம் சித்தா':1,'சொந்தம்':2};
 var bl=(R.backlog||[]).filter(function(b){return !S.freeSkip[b.tid]&&(b.dur||30)<=free;});if(!bl.length)return null;
 bl.sort(function(a,b){var da=a.due||'9999',dd=b.due||'9999';if(da!==dd)return da<dd?-1:1;if(!!b.imp!==!!a.imp)return b.imp?1:-1;
  if(fillRun){var la=(a.loc===fillRun.loc||a.loc==='எங்கும்')?0:1,lb=(b.loc===fillRun.loc||b.loc==='எங்கும்')?0:1;if(la!==lb)return la-lb;}return (rk[a.div]||0)-(rk[b.div]||0);});
 return {free:free,b:bl[0]};}
function taskCard(x,isNext){var st=x.st,over=isOver(x),stv=over?'missed':st,k=' data-key="'+esc(x.key)+'"',sub=[],b='',h='';
 var s0=hm2m(x.time),e0=s0+(x.dur||0);
 if(st==='pending'){sub.push(x.time+(x.dur?'–'+m2hm(e0):'')+(x.loc?' · '+locN(x.loc):''));if(x.ptime&&x.time!==x.ptime)sub.push('⏰ '+t('snoozedFrom')+' '+x.ptime);}
 if(st==='started')sub.push(fmt(t('startedAt'),x.start.slice(11))+' · '+dur(workM(x,nowStrL())));
 if(st==='paused'){var lp=x.pauses[x.pauses.length-1]||{};sub.push('⏸ '+(lp.w||'')+' · '+(lp.f||'').slice(11)+' · '+dur(workM(x,nowStrL())));}
 if(st==='done'){sub.push((x.start?x.start.slice(11)+'–':'')+String(x.end).slice(11)+(x.mins!==''&&x.mins!=null?' · '+dur(x.mins):''));if(Number(x.late)>15)sub.push(fmt(t('lateBy'),dur(x.late)));if((x.pauses||[]).length)sub.push('⏸×'+x.pauses.length);}
 if(st==='skipped'&&x.note)sub.push(x.note);
 h+='<div class="th"><span class="tm">'+(x.emg?'⚡':esc(x.time))+'</span><b>'+esc(tN(x))+'</b>'+(x.imp?' ⭐':'')+' <span class="dv">'+(DIVI[x.div]||'')+'</span>'+(x.backlog?' 📥':'')+' '+stBadge(stv)+(isNext?' <span class="badge nx">'+t('nextL')+'</span>':'')+'</div>';
 if(sub.length)h+='<div class="ts">'+esc(sub.join(' · '))+'</div>';
 if(x.conflict&&st==='pending')h+='<div class="cfl"><span>⚠ '+fmt(t('cfWith'),esc(LANG==='en'&&x.conflict.en?x.conflict.en:x.conflict.name))+'</span><button class="tb mini" data-act="tmove"'+k+' data-to="'+x.conflict.to+'">⏩ '+x.conflict.to+'</button></div>';
 var subs=x.subs||[],sd=x.subsDone||[];
 if(subs.length){if(st==='done'||st==='skipped'){var miss=subs.filter(function(s,i){return sd.indexOf(i)<0;});h+='<div class="ts">✓ '+(subs.length-miss.length)+'/'+subs.length+(miss.length&&st==='done'?' · '+t('subMissL')+': '+esc(miss.map(function(s){return s.name;}).join(', ')):'')+'</div>';}
  else{h+='<div class="subs">';subs.forEach(function(s,i){var on=sd.indexOf(i)>=0;h+='<button class="sub'+(on?' on':'')+'" data-act="tsub"'+k+' data-i="'+i+'" data-v="'+(on?0:1)+'"><span class="cb">'+(on?'☑':'☐')+'</span>'+(s.time?'<span class="stm">'+s.time+'</span>':'')+'<span>'+esc(s.name)+'</span></button>';});h+='</div>';}}
 if(st==='pending')b+='<button class="tb go" data-act="tstart"'+k+'>▶ '+t('tStart')+'</button><button class="tb ok" data-act="tdone"'+k+'>✓</button><button class="tb" data-act="tsnooze"'+k+'>⏰</button><button class="tb" data-act="tskip"'+k+'>✕</button>';
 else if(st==='started')b+='<button class="tb" data-act="tpause"'+k+'>⏸ '+t('tPause')+'</button><button class="tb ok" data-act="tdone"'+k+'>✓ '+t('tDone')+'</button>';
 else if(st==='paused')b+='<button class="tb go" data-act="tresume"'+k+'>▶ '+t('tResume')+'</button><button class="tb ok" data-act="tdone"'+k+'>✓ '+t('tDone')+'</button>';
 else if(S.undo[x.key]&&S.undo[x.key]>Date.now())b+='<button class="tb" data-act="treset"'+k+'>'+t('undo')+'</button>';
 if(x.tid==='ACC'&&st!=='done')b+='<button class="tb" data-act="plan">🌙</button>';
 if(x.emg)b+='<button class="tb" data-act="tdel"'+k+'>🗑</button>';
 if(b)h+='<div class="tbs">'+b+'</div>';
 return '<div class="task '+st+(over?' over':'')+(isNext?' nxt':'')+(x.emg?' emgt':'')+(st==='done'||st==='skipped'?' dim':'')+'">'+h+'</div>';}

 if(r.missedImp.length){h+='<div class="sub2 out">❗ '+t('rvImp')+'</div>';r.missedImp.forEach(function(m){h+='<div class="rvl out">• '+esc(m.time||'')+' '+esc(tN(m))+(m.note?' — '+esc(m.note):'')+'</div>';});}

 if(r.late.length){h+='<div class="sub2">⏰ '+t('rvLate')+'</div>';r.late.forEach(function(m){h+='<div class="rvl">• '+esc(tN(m))+' · +'+dur(m.late)+'</div>';});}
 h+='<div class="sub2">📈 '+t('rvTrend')+'</div><div class="trend">';r.trend.forEach(function(d){var pc=d.planned?Math.round(d.done/d.planned*100):0;h+='<div><span>'+(d.planned?pc+'%':'—')+'</span><i style="height:'+(d.planned?Math.max(3,Math.round(pc*0.5)):0)+'px"></i>'+DAYN[LANG][new Date(+d.date.slice(0,4),+d.date.slice(5,7)-1,+d.date.slice(8)).getDay()]+'</div>';});h+='</div>';

function b64d(str){var s=atob(str),a=new Uint8Array(s.length);for(var i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a;}
function rnd(n){var a=new Uint8Array(n);crypto.getRandomValues(a);return a;}

 navigator.credentials.get({publicKey:{challenge:rnd(32),allowCredentials:[{type:'public-key',id:b64d(CFG.bio),transports:['internal']}],userVerification:'required',timeout:60000}})
  .then(function(c){if(c)unlockOk();}).catch(function(e){if(!auto){var m=$('pinMsg');if(m)m.textContent=L('கைரேகை வேலை செய்யவில்லை — PIN போடவும்','Fingerprint failed — use PIN');}});}

function mCall(fn,args,cid){var ac=null,tm=0;try{ac=new AbortController();tm=setTimeout(function(){try{ac.abort();}catch(e){}},45000);}catch(e){ac=null;}
 return fetch(CFG.mApi,{method:'POST',body:JSON.stringify({key:CFG.mKey||'',fn:fn,args:args||[],cid:cid||'',u:CFG.mApi}),redirect:'follow',signal:ac?ac.signal:undefined})
 .then(function(r){if(!r.ok)throw new Error('NetworkError HTTP '+r.status);return r.text();})
 .then(function(txt){clearTimeout(tm);var j;try{j=JSON.parse(txt);}catch(e){var tt=String(txt||'').replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim().slice(0,140);throw new Error('NetworkError bad response: '+tt);}
   if(!j||!j.ok)throw new Error((j&&j.err)||'?');return j.r;},
  function(e){clearTimeout(tm);var m=String((e&&e.message)||e);throw new Error(/^NetworkError/.test(m)?m:'NetworkError '+(e&&e.name==='AbortError'?'timeout':m));});}
function mCk(fn,args){return 'm:'+fn+':'+JSON.stringify(args||[]);}

function mGet(fn,args,ok,fail){var c=mCache(fn,args);if(c)ok(c,true);if(!mOn())return;busy(true);
 mCall(fn,args).then(function(r){busy(false);lsSet(mCk(fn,args),JSON.stringify(r));ok(r,false);},
  function(e){busy(false);if(emsg(e)==='AUTH'){mAuthFail();return;}if(fail)fail(e,!!c);else if(!c&&!isNet(e))toast('⚠ '+emsg(e),true);});}

 var drop=function(){var q2=mqGet().filter(function(x){return x.cid!==it.cid;});mqSet(q2);mFlushing=false;qBadge();return q2;};
 mCall(it.fn,it.args,it.cid).then(function(r){var q2=drop();mApply(it.fn,it.args,r);if(q2.length)mFlush();else mDone(true);},
  function(e){var m=emsg(e);if(isNet(e)||m==='AUTH'||/BUSY/.test(m)||retryErr(m)){mFlushing=false;qBadge();if(m==='AUTH')mAuthFail();return;}

 if((fn==='mCustSave'||fn==='mCustOrder')&&r.custs){MS.cust=r;lsSet(mCk('mCustList',[]),JSON.stringify(r));return;}
 if(fn==='mGridSet'&&(r.days||r.rows)){MS.grid=r;return;}
 if(fn==='mPhoto')return;
 if(r.dup){if(r.today)mSetToday(r.today);return;}
 if(fn==='mCancel'){if(r.today)mSetToday(r.today);return;}
 if(/^mPay/.test(fn)&&r.custs){MS.pay=r;MS.payTab=r.tab;lsSet(mCk('mPayList',[r.tab]),JSON.stringify(r));return;}
 if(/^mLeave/.test(fn)&&r.rows){MS.leave=r;lsSet(mCk('mLeaveList',[]),JSON.stringify(r));return;}

 if(!mOn()){toast('⚠ '+L('முதலில் பால் கணக்கை இணைக்கவும் (⚙)','Link the milk account first (⚙)'),true);return;}

 if(!navigator.onLine){queue();return;}
 busy(true);
 mCall(fn,args,cid).then(function(r){busy(false);mApply(fn,args,r);if(done)done(r);},
  function(e){busy(false);var m=emsg(e);if(m==='AUTH'){mAuthFail();return;}
   if(isNet(e)||/BUSY/.test(m)||retryErr(m)){queue();return;}
   toast('⚠ '+m,true);});}

 h+='<div class="tools"><select id="grTab" class="inp">'+tabs.slice().reverse().map(function(tb){return '<option value="'+esc(tb)+'"'+(g&&tb===g.tab?' selected':'')+'>'+esc(mMonL(tb))+'</option>';}).join('')+'</select></div>';
 h+='<div class="mseg"><button class="'+(MS.gridMode==='cust'?'on':'')+'" data-act="grmode" data-v="cust">👤 '+L('ஒருவர்','One customer')+'</button><button class="'+(MS.gridMode==='day'?'on':'')+'" data-act="grmode" data-v="day">📋 '+L('ஒரு நாள் — எல்லோரும்','One day — all')+'</button></div>';
 if(MS.gridMode==='cust'){var cl=(MS.cust&&MS.cust.custs)||[];
  h+='<select id="grCust" class="inp" style="margin-bottom:10px"><option value="">— '+L('வாடிக்கையாளர் தேர்வு','Choose customer')+' —</option>'+['FN','AN'].map(function(G){return '<optgroup label="'+shN(G)+'">'+cl.filter(function(c){return c.f===G&&c.st!==M_PEND;}).map(function(c){return '<option value="'+esc(c.id)+'"'+(c.id===MS.gridId?' selected':'')+'>'+esc((c.rt?c.rt+' - ':'')+c.n+(c.st===M_LEFT?' ('+L('விலகியவர்','left')+')':''))+'</option>';}).join('')+'</optgroup>';}).join('')+'</select>';
  if(!g||!g.days||g.id!==MS.gridId)return h+(MS.gridId?'<div class="card empty">'+L('ஏற்றுகிறது…','Loading…')+'</div>':'');
  h+='<div class="card"><div class="row"><span><b>'+esc((g.rt?g.rt+' - ':'')+g.n)+'</b> <span class="s">'+shN(g.f)+'</span></span><span class="s">'+g.litr.toFixed(1)+L(' லி · ',' L · ')+money(g.tot)+'</span></div><div class="gcal">';
  (LANG==='en'?['S','M','T','W','T','F','S']:['ஞா','தி','செ','பு','வி','வெ','ச']).forEach(function(w){h+='<div class="gw">'+w+'</div>';});
  for(var i=0;i<g.dow1;i++)h+='<div></div>';
  g.days.forEach(function(x){var cls=x.q===0?' z':x.q===''?' e':(x.q!==g.req?' df':'');h+='<button class="gd'+cls+(x.wo?' wo':'')+(x.d===g.today?' td':'')+'" data-act="grcell" data-d="'+x.d+'"><span>'+x.d+'</span><b>'+(x.q===''?'·':x.q)+'</b></button>';});
  h+='</div><div class="small" style="margin-top:6px">'+L('சிவப்பு = 0 · நீலம் = வழக்கத்திலிருந்து மாறியது · சாம்பல் = வார விடுமுறை · பச்சைக் கோடு = இன்று','Red = 0 · blue = changed from usual · grey = weekly off · green border = today')+'</div></div>';
  return h;}
 if(!g||!g.rows)return h+'<div class="card empty">'+L('ஏற்றுகிறது…','Loading…')+'</div>';
 h+='<div class="tools"><button class="tb" data-act="grday" data-v="-1">‹</button><div style="flex:1;text-align:center;font-weight:700">'+g.day+' '+esc(mMonL(g.tab))+(g.day===g.today?' · '+L('இன்று','today'):'')+'</div><button class="tb" data-act="grday" data-v="1">›</button></div>';
 h+='<div class="card"><div class="three"><div><small>'+shN('FN')+'</small><b>'+g.tot.FN+L(' லி',' L')+'</b></div><div><small>'+shN('AN')+'</small><b>'+g.tot.AN+L(' லி',' L')+'</b></div><div><small>'+L('மொத்தம்','Total')+'</small><b>'+(Math.round((g.tot.FN+g.tot.AN)*100)/100)+'</b></div></div></div><div class="card">';
 var last='';g.rows.forEach(function(x){var gk=x.act?x.f:'x';if(gk!==last){h+='<div class="gt" style="margin:6px 0 2px">'+(x.act?shN(x.f):L('விலகியவர்','Left'))+'</div>';last=gk;}
  h+='<div class="mstop" data-act="grrow" data-id="'+esc(x.id)+'" style="cursor:pointer"><div>'+(x.rt!==''?'<span class="rtn">'+esc(x.rt)+'</span> - ':'')+esc(x.n)+'</div><div class="q '+(x.q===0?'out':(x.q!==''&&x.q!==x.req?'dnq':''))+'">'+(x.q===''?'·':x.q+L(' லி',' L'))+'</div></div>';});
 return h+'</div>';}
function grLoad(){var tab=MS.gridTab||'';if(MS.gridMode==='cust'){if(!MS.cust)mGet('mCustList',[],function(r){MS.cust=r;if(MS.tab==='grid'&&!sheetOpen())mRender();});
  if(!MS.gridId){mRender();return;}mGet('mGrid',[tab,MS.gridId],function(r){MS.grid=r;MS.gridTab=r.tab;if(MS.tab==='grid'&&!sheetOpen())mRender();},function(e,had){if(!had)toast('⚠ '+emsg(e),true);});}
 else mGet('mGridDay',[tab,MS.gridDay||0],function(r){MS.grid=r;MS.gridTab=r.tab;MS.gridDay=r.day;if(MS.tab==='grid'&&!sheetOpen())mRender();},function(e,had){if(!had)toast('⚠ '+emsg(e),true);});}
/* ---- செயல்கள் ---- */
var MACT2={
 mcovopen:function(){mCovSheet();},
 mcover:function(b){var ds=b.getAttribute('data-d'),m=b.getAttribute('data-m');qPush('setCover',[ds,m]);
  try{var c=mCovGet();lsSet('c:getCover:[]',JSON.stringify(c));}catch(e){}closeSheet();mRender();toast(t('cvSaved'));},
 cunew:function(){MS.cuForm=cuBlank();mRender();window.scrollTo(0,0);},
 cuopen:function(b){var c=cuFind(b.getAttribute('data-id'));if(!c)return;MS.cuForm=cuEdit(c);mRender();window.scrollTo(0,0);},
 cuback:function(){MS.cuForm=null;MS.cuOrder=null;mRender();},
 cufst:function(b){MS.cuF.st=b.getAttribute('data-v');mRender();},
 cuff:function(b){MS.cuF.f=b.getAttribute('data-v');mRender();},
 cuset:function(b){cuGrab();var k=b.getAttribute('data-k'),v=b.getAttribute('data-v'),f=MS.cuForm;f[k]=v;
  if(k==='f'&&f.wsw&&(f.wsw==='மாலையில் கொடு'?'AN':'FN')===v)f.wsw='';
  if(k==='f'&&f.isNew)f.pos=MS.cust.custs.filter(function(c){return c.st===M_ACT&&c.f===v;}).length+1;mRender();},
 cuwd:function(b){cuGrab();var v=b.getAttribute('data-v'),a=MS.cuForm.woff,i=a.indexOf(v);if(i>=0)a.splice(i,1);else a.push(v);if(!a.length)MS.cuForm.wsw='';mRender();},
 cugps:function(){cuGrab();if(!navigator.geolocation){toast('⚠ GPS',true);return;}toast(L('📍 இருப்பிடம் எடுக்கிறது…','📍 Getting location…'));
  navigator.geolocation.getCurrentPosition(function(p){var f=MS.cuForm;if(!f)return;f.lat=Math.round(p.coords.latitude*1e6)/1e6;f.lng=Math.round(p.coords.longitude*1e6)/1e6;mRender();toast('✓ 📍 ±'+Math.round(p.coords.accuracy||0)+' m');},
   function(){toast('⚠ '+L('இருப்பிடம் கிடைக்கவில்லை — GPS / அனுமதியைப் பாருங்கள்','Could not get location — check GPS / permission'),true);},{enableHighAccuracy:true,timeout:25000,maximumAge:0});},
 cugpsx:function(){cuGrab();MS.cuForm.lat=null;MS.cuForm.lng=null;mRender();},
 cuphload:function(){var f=MS.cuForm;if(!navigator.onLine){toast('⚠ '+t('needNet'),true);return;}busy(true);
  mCall('mPhotoGet',[f.id]).then(function(r){busy(false);if(r&&r.b64){MS.photos[f.id]=r.b64;mRender();}},function(e){busy(false);toast('⚠ '+emsg(e),true);});},
 cusave:function(){cuGrab();var f=MS.cuForm,o=MS.cust.opt;
  if(!f.n){toast('⚠ '+L('பெயர் தேவை','Name is required'),true);return;}
  if(!(Number(f.rate)>0)){toast('⚠ '+L('விலை தேவை','Rate is required'),true);return;}
  var pk=(Number(f.p1)||0)+0.7*(Number(f.p07)||0)+0.5*(Number(f.p05)||0);if(pk>0&&Math.abs(pk-Number(f.q))>0.001){toast('⚠ '+L('கவர் கூட்டல், தினசரி அளவுடன் பொருந்தவில்லை','Covers do not add up to the daily quantity'),true);return;}
  if(f.isNew&&(!f.start||f.start<tdy())){toast('⚠ '+L('தொடக்கத் தேதி இன்று அல்லது பின்னர்','Start date must be today or later'),true);return;}
  var a={isNew:f.isNew,id:f.id,st:f.st,f:f.f,pos:f.pos,n:f.n,mob:f.mob,wa:f.wa,rate:f.rate,q:f.q,p1:f.p1||0,p07:f.p07||0,p05:f.p05||0,canred:f.canred,min:f.min,ccat:f.ccat,bmode:f.bmode,recip:f.recip,rem:f.rem,
   freq:f.freq===o.alt?o.alt:o.daily,daily:o.daily,altStart:f.altStart,woff:f.woff,wsw:f.wsw,lat:f.lat,lng:f.lng,addr:f.addr,start:f.start,qToday:!!f.qToday};
  var photo=f.photoNew;
  mDo('mCustSave',[a],function(r){if(!r){MS.cuForm=null;mRender();return;}
   var id=r.saved;MS.cuForm=null;mRender();toast('✓ '+(f.isNew?L('சேர்க்கப்பட்டது — ','Added — ')+id:t('updated')));
   if(photo&&id){MS.photos[id]=photo;mDo('mPhoto',[id,photo],function(){toast('✓ 📷');});}});},
 cuorder:function(){cuOrderInit(MS.cuF.f||mF());mRender();window.scrollTo(0,0);},
 cuof:function(b){cuOrderInit(b.getAttribute('data-f'));mRender();},
 cuup:function(b){var i=+b.getAttribute('data-i'),a=MS.cuOrder.ids;if(i>0){var x=a[i];a[i]=a[i-1];a[i-1]=x;}mRender();},
 cudn:function(b){var i=+b.getAttribute('data-i'),a=MS.cuOrder.ids;if(i<a.length-1){var x=a[i];a[i]=a[i+1];a[i+1]=x;}mRender();},
 cuosave:function(){var o=MS.cuOrder;mDo('mCustOrder',[o.f,o.ids],function(r){MS.cuOrder=null;mRender();if(r)toast('✓ '+L('வழி வரிசை சேமிக்கப்பட்டது','Route order saved'));});},
 grmode:function(b){MS.gridMode=b.getAttribute('data-v');MS.grid=null;grLoad();mRender();},
 grcell:function(b){var g=MS.grid,d=+b.getAttribute('data-d'),x=g.days[d-1];grAmtSheet(g.id,d,x.q,(g.rt?g.rt+' - ':'')+g.n);},
 grrow:function(b){var g=MS.grid,id=b.getAttribute('data-id'),x=null;g.rows.forEach(function(r){if(r.id===id)x=r;});if(x)grAmtSheet(id,g.day,x.q,(x.rt!==''?x.rt+' - ':'')+x.n);},
 grset:function(b){var v=b.getAttribute('data-v'),p=MS.grPick,g=MS.grid;closeSheet();var val=v===''?'':Number(v);
  mDo('mGridSet',[g.tab,p.id,p.day,val,MS.gridMode],function(r){if(r)mRender();},function(){if(g.days&&g.days[p.day-1])g.days[p.day-1].q=val;if(g.rows)g.rows.forEach(function(x){if(x.id===p.id)x.q=val;});mRender();});},
 grday:function(b){var g=MS.grid;if(!g)return;var d=(g.day||1)+Number(b.getAttribute('data-v'));if(d<1||d>g.nd)return;MS.gridDay=d;grLoad();}
};
Object.keys(MACT2).forEach(function(k){ACT[k]=MACT2[k];});
document.addEventListener('input',function(e){var id=e.target&&e.target.id;
 if(id==='cuQ'){MS.cuF.q=e.target.value;var l=$('cuList');if(l)l.innerHTML=cuListHtml();}
 else if(id==='cu_p1'||id==='cu_p07'||id==='cu_p05'){cuGrab();var f=MS.cuForm,pk=(Number(f.p1)||0)+0.7*(Number(f.p07)||0)+0.5*(Number(f.p05)||0),el=$('cu_pk');if(el){el.textContent=L('கவர் கூட்டல் = ','Covers add up to ')+(Math.round(pk*100)/100)+L(' லி',' L');el.className='small '+(Math.abs(pk-Number(f.q))<0.001||pk===0?'':'out');}}});
document.addEventListener('change',function(e){var id=e.target&&e.target.id;
 if(id==='cu_q'){cuGrab();var f=MS.cuForm,q=Number(f.q),p=[0,0,0];var best=null;for(var a=0;a<=5;a++)for(var m=0;m<=4;m++)for(var h=0;h<=6;h++){if(Math.abs(a+0.7*m+0.5*h-q)>0.001)continue;var n=a+m+h;if(!best||n<best[3])best=[a,m,h,n];}
  if(best){f.p1=best[0];f.p07=best[1];f.p05=best[2];}mRender();}
 else if(id==='cu_ph'&&e.target.files&&e.target.files[0]){cuGrab();var f2=MS.cuForm;cuResize(e.target.files[0],function(d){f2.photoNew=d;if(!f2.isNew){MS.photos[f2.id]=d;mDo('mPhoto',[f2.id,d],function(r){if(r)toast('✓ 📷 '+L('புகைப்படம் சேமிக்கப்பட்டது','Photo saved'));});}mRender();});}
 else if(id==='grCust'){MS.gridId=e.target.value;MS.grid=null;grLoad();mRender();}
 else if(id==='grTab'){MS.gridTab=e.target.value;MS.grid=null;grLoad();mRender();}});

function boot(){var h=location.hash||'';
 if(h.indexOf('#mk=')===0){var mq={};h.slice(1).split('&').forEach(function(x){var i=x.indexOf('=');if(i>0)mq[x.slice(0,i)]=decodeURIComponent(x.slice(i+1));});
  try{history.replaceState(null,'',location.pathname+location.search);}catch(e){}h='';
  if(mq.mk&&mq.mu){CFG.mKey=mq.mk;CFG.mApi=mq.mu;saveCfg();MS.linkPending=true;MS.authBad=false;}
  if(!CFG.key){showSetup(L('முதலில் My Accounts ரகசியக் குறியைப் போடவும் — பிறகு பால் தானாக இணையும்','Enter the My Accounts key first — milk links after that'));return;}
  if(started){mAutoLink();go('milk');return;}}
 if(h.indexOf('#k=')===0){var k=decodeURIComponent(h.slice(3));try{history.replaceState(null,'',location.pathname+location.search);}catch(e){}showSetup(L('புதிய PIN அமைக்கவும்','Set a PIN'),k);return;}
 if(!CFG.key){showSetup('');return;}
 if(CFG.locked&&CFG.pin){showPin();return;}
 if(nightCheck())return;
 startApp();}
window.addEventListener('hashchange',function(){var h=location.hash||'';if(h.indexOf('#k=')===0||h.indexOf('#mk=')===0)boot();});
if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(function(){});}
boot();
</script>
