.prow:first-child{border-top:0}

.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;background:var(--g2);color:var(--g);font-weight:600;margin-right:4px}

.tools{display:flex;gap:8px;align-items:center;margin-bottom:12px}

.empty{text-align:center;color:var(--mut);padding:24px 8px;font-size:14px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

.small{font-size:13px;line-height:1.7;color:var(--mut)}

.badge.p{background:#eef1ed;color:var(--mut)}

#sheet{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:8;display:flex;align-items:flex-end}

.sbox{background:var(--bg);width:100%;max-width:560px;margin:0 auto;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:14px 14px 30px}
.shead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}

</style></head>

var flushing=false;

function flush(){if(flushing)return;var q=qGet();if(!q.length){qBadge();return;}flushing=true;var item=q[0],fn=item.fn||'saveEntry',args=item.fn?item.args:[item];
 var drop=function(){var q2=qGet().filter(function(x){return x.cid!==item.cid;});qSet(q2);flushing=false;qBadge();return q2;};
 google.script.run.withSuccessHandler(function(res){var q2=drop();
   if(res&&res.items&&(fn==='taskAct'||fn==='emergency'||fn==='backlogAct')){S.tasksRaw=res;lsSet('c:getTasks:[]',JSON.stringify(res));}
   if(q2.length)flush();else onSynced(fn);})
  .withFailureHandler(function(e){var m=emsg(e);if(isNet(e)||m==='AUTH'){flushing=false;qBadge();return;}
   var q2=drop();toast('⚠ '+m,true);if(q2.length)setTimeout(flush,200);else onSynced(fn);})[fn].apply(null,args);}
function onSynced(fn){if(!S.init)return;if(S.page==='task'&&!sheetOpen()){if(fn==='taskAct'||fn==='emergency'||fn==='backlogAct')renderTasks();else loadTasks();}
 if(S.page==='add'&&!S.type)renderGrid();}
function queueIt(o){var q=qGet();if(!q.some(function(x){return x.cid===o.cid;}))q.push(o);qSet(q);qBadge();afterSave(o,true);setTimeout(flush,0);}

function applyTask(R,fn,a){
 if(fn==='emergency'){var o=a[0],at=a[1]||nowStrL();if(o.key.slice(0,10)!==R.today||R.items.some(function(x){return x.key===o.key;}))return;
  R.items.forEach(function(x){if(x.st==='started'){x.st='paused';x.pauses=(x.pauses||[]).concat([{f:at,t:'',w:'⚡ '+o.name}]);}});
  R.items.push({key:o.key,tid:o.key.split('|')[1],name:'⚡ '+o.name,time:at.slice(11),ptime:at.slice(11),st:'started',start:at,end:'',mins:'',div:o.div,kind:'அவசரம்',emg:true,subs:[],subsDone:[],pauses:[],dur:0,loc:'',imp:false});return;}
 if(fn==='backlogAct'){var tid=a[0],b=null;(R.backlog||[]).forEach(function(z,i){if(z.tid===tid)b=R.backlog.splice(i,1)[0];});var at2=a[2]||nowStrL();
  if(b&&!R.items.some(function(x){return x.tid===tid;}))R.items.push({key:R.today+'|'+tid,tid:tid,name:b.name,en:b.en,time:at2.slice(11),ptime:at2.slice(11),st:'pending',div:b.div,loc:b.loc,dur:b.dur,imp:b.imp,backlog:true,subs:[],subsDone:[],pauses:[]});
  a=[R.today+'|'+tid,a[1],'',at2];fn='taskAct';}
 if(fn==='markDone'){a=[R.today+'|ACC','done','',a[0]];fn='taskAct';}
 if(fn!=='taskAct')return;
 var key=a[0],act=a[1],arg=a[2],at=a[3]||nowStrL(),x=null;R.items.forEach(function(y){if(y.key===key)x=y;});if(!x)return;
 function close(){var p=x.pauses||[];if(p.length&&!p[p.length-1].t)p[p.length-1].t=at;}
 function begin(){if(x.st==='pending'||x.st==='missed'){x.start=at;x.late=Math.max(0,hm2m(at.slice(11))-hm2m(x.ptime||x.time));}}
 function fin(){if(x.st==='paused')close();if(!x.start)x.start=at;x.st='done';x.end=at;x.mins=workM(x,at);}
 if(act==='start'||act==='resume'){begin();if(x.st==='paused')close();if(x.st!=='done')x.st='started';}
 else if(act==='pause'){if(x.st==='started'){x.st='paused';x.pauses=(x.pauses||[]).concat([{f:at,t:'',w:arg}]);}}
 else if(act==='done'){if(x.st!=='done')fin();}
 else if(act==='sub'){var p=String(arg).split(':'),i=+p[0],v=p[1]==='1',sd=x.subsDone||(x.subsDone=[]),j=sd.indexOf(i);
  if(v&&j<0)sd.push(i);if(!v&&j>=0)sd.splice(j,1);
  if(v&&x.st!=='done'){begin();if(x.st==='paused')close();x.st='started';if(x.subs&&x.subs.length&&sd.length>=x.subs.length)fin();}}
 else if(act==='snooze'){if(x.st==='pending'||x.st==='missed'){x.st='pending';x.time=m2hm(hm2m(at.slice(11))+Math.max(5,+arg||30));}}
 else if(act==='move'){if(x.st==='pending'||x.st==='missed'){x.time=arg;x.ptime=arg;}}
 else if(act==='skip'||act==='tomorrow'){if(x.st!=='done'){x.st='skipped';x.end=at;x.note=act==='tomorrow'?'⏩ '+t('tmrwS'):arg;}}
 else if(act==='reset'){x.st='pending';x.start='';x.end='';x.mins='';x.note='';x.subsDone=[];x.pauses=[];}}
function conflictsL(items){var bl=items.filter(function(i){return i.cover&&!i.skip&&i.time;}).map(function(i){return {s:hm2m(i.time),e:hm2m(i.time)+(i.dur||0),name:i.name,en:i.en};});
 items.forEach(function(i){delete i.conflict;if(i.cover||i.skip||!i.time||i.st==='done')return;var s=hm2m(i.time);
  bl.forEach(function(z){if(!i.conflict&&s>=z.s&&s<z.e)i.conflict={name:z.name,en:z.en,to:m2hm(z.e)};});});}
function sortT(a,b){return (a.time||'99')<(b.time||'99')?-1:(a.time||'99')>(b.time||'99')?1:0;}

 else h+='<button class="done" data-act="dnd">🔕 '+t('dndBtn')+'</button>';
 h+='<div class="covrow"><span>🛵 '+t('coverQ')+'</span><div class="chips"><button class="chip'+(R.cover.today?' on':'')+'" data-act="cover" data-d="'+R.today+'" data-on="'+(R.cover.today?0:1)+'">'+t('today')+'</button></div></div>';
 if(!R.planned.tomorrow&&nm>=19*60)h+='<div class="hint warn" data-act="plan" style="margin-top:10px">🌙 '+t('plNotYet')+' ›</div>';
 var cf=R.items.filter(function(x){return x.conflict&&x.st==='pending';});if(cf.length)h+='<div class="hint warn" style="margin-top:10px">⚠ '+fmt(t('cfN'),cf.length)+'</div>';
 var run=R.items.filter(function(x){return x.st==='started'||x.st==='paused';}),rest=R.items.filter(function(x){return run.indexOf(x)<0;});
 if(run.length)h+='<div class="gt">'+t('nowRun')+'</div><div class="card">'+run.map(function(x){return taskCard(x,false);}).join('')+'</div>';
 var nx=null;rest.forEach(function(x){if(!nx&&x.st==='pending'&&!isOver(x)&&x.time&&hm2m(x.time)+(x.dur||0)>=nm)nx=x.key;});

 if(!bl.length)h+='<div class="small">'+t('blNone')+'</div>';
 bl.forEach(function(b){h+='<div class="prow"><div data-act="bledit" data-tid="'+esc(b.tid)+'" style="flex:1"><b>'+DIVI[b.div]+' '+esc(tN(b))+'</b>'+(b.imp?' ⭐':'')+'<div class="s">'+dur(b.dur)+' · '+esc(locN(b.loc))+(b.due?' · '+t('tDueS')+' '+dmy(b.due):'')+'</div></div><button class="tb mini" data-act="blstart" data-tid="'+esc(b.tid)+'">▶</button><button class="tb mini ok" data-act="bldone" data-tid="'+esc(b.tid)+'">✓</button></div>';});
 h+='<button class="save sec" data-act="bladd">'+t('blAdd')+'</button></details>';
 h+='<div class="g2"><button class="save sec" data-act="newtask">＋ '+t('newTask')+'</button><button class="save sec" data-act="alltasks">⚙ '+t('editTasks')+'</button></div>';
 $('taskBox').innerHTML=h;}

function taskCard(x,isNext){var st=x.st,over=isOver(x),stv=over?'missed':st,k=' data-key="'+esc(x.key)+'"',sub=[],b='',h='';
 var s0=hm2m(x.time),e0=s0+(x.dur||0);

 if(st==='done'){sub.push((x.start?x.start.slice(11)+'–':'')+String(x.end).slice(11)+(x.mins!==''&&x.mins!=null?' · '+dur(x.mins):''));if(Number(x.late)>15)sub.push(fmt(t('lateBy'),dur(x.late)));if((x.pauses||[]).length)sub.push('⏸×'+x.pauses.length);}
 if(st==='skipped'&&x.note)sub.push(x.note);
 h+='<div class="th"><span class="tm">'+(x.emg?'⚡':esc(x.time))+'</span><b>'+esc(tN(x))+'</b>'+(x.imp?' ⭐':'')+' <span class="dv">'+(DIVI[x.div]||'')+'</span>'+(x.backlog?' 📥':'')+' '+stBadge(stv)+(isNext?' <span class="badge nx">'+t('nextL')+'</span>':'')+'</div>';

 if(st==='pending')b+='<button class="tb go" data-act="tstart"'+k+'>▶ '+t('tStart')+'</button><button class="tb ok" data-act="tdone"'+k+'>✓</button><button class="tb" data-act="tsnooze"'+k+'>⏰</button><button class="tb" data-act="tskip"'+k+'>✕</button>';

function dayName(ds){var p=ds.split('-');try{return new Date(+p[0],+p[1]-1,+p[2]).toLocaleDateString(LANG==='en'?'en-IN':'ta-IN',{weekday:'long'});}catch(e){return '';}}

 openSheet('<div class="shead"><b>🌙 '+t('planT')+'</b><button class="x" data-act="close">✕</button></div><div id="rvBox"><div class="empty">…</div></div><div id="plBox"><div class="empty">…</div></div>');
 call('getReview',[tdy()],renderReview,function(){var e=$('rvBox');if(e)e.innerHTML='';});
 call('getPlan',[S.planD],function(p){S.plan=p;renderPlan();},function(e){var b=$('plBox');if(b)b.innerHTML='<div class="card empty">'+esc(isNet(e)?t('e_offline'):emsg(e))+'</div>';});}
function renderReview(r){var e=$('rvBox');if(!e)return;var h='<div class="card"><div class="ch">📊 '+t('rvT')+' · '+dmy(r.date)+'</div>';
 h+='<div class="three"><div><small>'+t('rvDone')+'</small><b class="in">'+r.done+'/'+r.planned+'</b></div><div><small>'+t('rvMissed')+'</small><b class="'+(r.missed?'out':'')+'">'+r.missed+'</b></div><div><small>'+t('rvSkip')+'</small><b>'+r.skipped+'</b></div></div>';
 if(r.missedImp.length){h+='<div class="sub2 out">❗ '+t('rvImp')+'</div>';r.missedImp.forEach(function(m){h+='<div class="rvl out">• '+esc(m.time||'')+' '+esc(tN(m))+(m.note?' — '+esc(m.note):'')+'</div>';});}
 else h+='<div class="hint" style="margin-top:10px">'+t('rvGood')+'</div>';
 if(r.subMiss.length){h+='<div class="sub2">☐ '+t('rvSub')+'</div>';r.subMiss.forEach(function(m){h+='<div class="rvl">• '+esc(tN(m))+': '+esc(m.miss.join(', '))+'</div>';});}
 var tot=0;S.init.divs.forEach(function(d){tot+=r.byDiv[d]||0;});
 h+='<div class="sub2">⏱ '+t('rvDiv')+' · '+dur(tot)+'</div>';
 S.init.divs.forEach(function(d){var m=r.byDiv[d]||0;h+='<div class="barrow"><span>'+DIVI[d]+' '+esc(divN(d))+'</span><span>'+dur(m)+'</span><div class="bt"><i class="in" style="width:'+(tot?Math.max(2,Math.round(m/tot*100)):0)+'%"></i></div></div>';});
 var pk=Object.keys(r.pauses||{});if(pk.length)h+='<div class="sub2">⏸ '+t('rvPause')+'</div><div class="chips">'+pk.map(function(w){return '<span class="chip">'+esc(w)+' ×'+r.pauses[w]+'</span>';}).join('')+'</div>';
 if(r.emg.length){h+='<div class="sub2">⚡ '+t('rvEmg')+'</div>';r.emg.forEach(function(m){h+='<div class="rvl">• '+esc(m.name)+' · '+dur(m.mins)+'</div>';});}
 if(r.late.length){h+='<div class="sub2">⏰ '+t('rvLate')+'</div>';r.late.forEach(function(m){h+='<div class="rvl">• '+esc(tN(m))+' · +'+dur(m.late)+'</div>';});}
 h+='<div class="sub2">📈 '+t('rvTrend')+'</div><div class="trend">';r.trend.forEach(function(d){var pc=d.planned?Math.round(d.done/d.planned*100):0;h+='<div><span>'+(d.planned?pc+'%':'—')+'</span><i style="height:'+(d.planned?Math.max(3,Math.round(pc*0.5)):0)+'px"></i>'+DAYN[LANG][new Date(+d.date.slice(0,4),+d.date.slice(5,7)-1,+d.date.slice(8)).getDay()]+'</div>';});h+='</div>';
 h+='<button class="save sec" data-act="report">'+t('rvAll')+'</button></div>';e.innerHTML=h;}
function planItems(){var p=S.plan,ed=S.planEd||{};var items=p.items.filter(function(i){return i.st!=='done';}).map(function(i){var c=JSON.parse(JSON.stringify(i)),e=ed[i.tid];if(e){if(e.time!=null)c.time=e.time;if(e.skip!=null)c.skip=e.skip;}return c;});
 Object.keys(ed).forEach(function(tid){if(ed[tid].add&&!items.some(function(i){return i.tid===tid;})){var b=null;p.backlog.forEach(function(z){if(z.tid===tid)b=z;});if(b)items.push({tid:tid,name:b.name,en:b.en,time:ed[tid].time||'',dur:b.dur,div:b.div,loc:b.loc,imp:b.imp,backlog:true,st:'pending',skip:false,auto:false,added:true});}});
 items.sort(sortT);conflictsL(items);return items;}
function renderPlan(){var e=$('plBox'),p=S.plan;if(!e||!p)return;var items=planItems(),h='<div class="card"><div class="ch">📅 '+t('plT')+' · '+esc(dayName(p.date))+' '+dmy(p.date)+'</div>';
 h+=p.planned?'<div class="hint">✓ '+t('plDone')+'</div>':'<div class="hint warn">'+t('plNot')+'</div>';
 h+='<div class="covrow" style="margin:10px 0"><span>🛵 '+t('plCover')+'</span><div class="chips"><button class="chip'+(p.cover?' on':'')+'" data-act="plcover" data-on="'+(p.cover?0:1)+'">'+(p.cover?t('yes'):t('no'))+'</button></div></div>';
 var ncf=items.filter(function(i){return i.conflict&&!i.skip;}).length;if(ncf)h+='<div class="hint warn">⚠ '+fmt(t('cfN'),ncf)+'</div>';
 items.forEach(function(i){h+='<div class="pli'+(i.skip?' sk':'')+(i.conflict&&!i.skip?' cf':'')+'"><input type="time" class="pt" data-tid="'+esc(i.tid)+'" value="'+esc(i.time||'')+'"><div class="pn"><b>'+(DIVI[i.div]||'')+' '+esc(tN(i))+'</b>'+(i.imp?' ⭐':'')+(i.auto||i.added?' <span class="badge">📥 '+t('plAuto')+'</span>':'')
  +'<div class="s">'+(i.dur?dur(i.dur):'')+(i.loc?' · '+esc(locN(i.loc)):'')+(i.nsubs?' · ☐×'+i.nsubs:'')+'</div>'
  +(i.conflict&&!i.skip?'<div class="cfl"><span>⚠ '+fmt(t('cfWith'),esc(LANG==='en'&&i.conflict.en?i.conflict.en:i.conflict.name))+'</span><button class="tb mini" data-act="plmove" data-tid="'+esc(i.tid)+'" data-to="'+i.conflict.to+'">⏩ '+i.conflict.to+'</button></div>':'')
  +'</div><button class="tb mini" data-act="plskip" data-tid="'+esc(i.tid)+'">'+(i.skip?'↺':'✕')+'</button></div>';});
 var left=p.backlog.filter(function(b){return !(S.planEd[b.tid]&&S.planEd[b.tid].add);});
 if(left.length){h+='<div class="sub2">📥 '+t('plLeft')+'</div>';left.forEach(function(b){h+='<div class="prow"><div><b>'+(DIVI[b.div]||'')+' '+esc(tN(b))+'</b><div class="s">'+dur(b.dur)+' · '+esc(locN(b.loc))+'</div></div><button class="tb mini" data-act="pladd" data-tid="'+esc(b.tid)+'">＋</button></div>';});}
 h+='<button class="save sec" data-act="plonce">'+t('plOnce')+'</button><button class="save" data-act="plgo">'+t('plGo')+'</button></div>';e.innerHTML=h;}
function planSet(tid,k,v){S.planEd[tid]=S.planEd[tid]||{};S.planEd[tid][k]=v;}
function planGo(){var items=planItems(),list=items.filter(function(i){return i.time||i.skip;}).map(function(i){return {tid:i.tid,time:i.time,skip:!!i.skip};});
 busy(true);google.script.run.withSuccessHandler(function(res){busy(false);S.plan=res.plan;S.planEd={};renderPlan();toast(fmt(t('plOk'),res.events));})
  .withFailureHandler(function(e){busy(false);if(isNet(e)){qPush('confirmPlan',[S.planD,list]);toast(t('plQueued'));}else toast('⚠ '+emsg(e),true);}).confirmPlan(S.planD,list);}

 list.forEach(function(x){var d=x.mode==='fixed'?x.days.split('').map(function(i){return DAYN[LANG][+i];}).join(' '):t('m_'+x.mode)+(x.mode==='once'&&x.date?' · '+dmy(x.date):'');
  h+='<div class="prow" data-act="edittask" data-id="'+esc(x.id)+'" style="'+(x.active?'':'opacity:.45')+'"><div><b>'+(DIVI[x.div]||'')+' '+esc(tN(x))+'</b>'+(x.imp?' ⭐':'')+(x.subs&&x.subs.length?' ☐×'+x.subs.length:'')+'<div class="s">'+esc(d)+' · '+dur(x.dur)+' · '+esc(locN(x.loc))+(x.rem?'':' · 🔕')+(x.active?'':' · '+t('inactive'))+'</div></div><b>'+esc(x.time||'—')+'</b></div>';});

/* ---- 🔒 இணைப்பு, பூட்டு (நீங்கள் பூட்டினால் / இரவு தானாக) & கைரேகை / போன் பூட்டு ---- */
function phash(pin){var s=String(pin)+'|'+(CFG.key||'').slice(0,12);
 if(window.crypto&&crypto.subtle&&window.TextEncoder)return crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)).then(function(b){return Array.prototype.map.call(new Uint8Array(b),function(x){return ('0'+x.toString(16)).slice(-2);}).join('');});
 var h=5381;for(var i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return Promise.resolve('d'+h);}
function L(ta,en){return LANG==='en'?en:ta;}
function showSetup(msg,key){var lk=$('lock');lk.classList.remove('hidden');
 lk.innerHTML='<div style="font-size:44px">📒</div><h2>'+esc(t('app'))+'</h2><div class="msg">'+esc(msg||'')+'</div><div class="box">'
  +'<div class="lab">'+L('ரகசியக் குறி (Sheet ▸ கணக்கு ▸ 📱 போனில் இணை)','Secret key (Sheet ▸ கணக்கு ▸ 📱 போனில் இணை)')+'</div><input id="suKey" class="inp" autocomplete="off" value="'+esc(key||CFG.key||'')+'">'
  +'<div class="g2"><div><div class="lab">'+L('புதிய PIN (4 இலக்கம்)','New PIN (4 digits)')+'</div><input id="suPin" class="inp" type="password" inputmode="numeric" maxlength="4"></div><div><div class="lab">'+L('மீண்டும் PIN','PIN again')+'</div><input id="suPin2" class="inp" type="password" inputmode="numeric" maxlength="4"></div></div>'
  +'<details style="margin-top:10px"><summary class="small">'+L('மேம்பட்டது','Advanced')+'</summary><div class="lab">API URL</div><input id="suApi" class="inp" value="'+esc(CFG.api)+'"></details>'
  +'<button class="save" id="suGo">'+L('✓ இணை','✓ Connect')+'</button></div>';
 $('suGo').onclick=function(){var k=$('suKey').value.trim(),p1=$('suPin').value,p2=$('suPin2').value,api=$('suApi').value.trim();
  if(k.length<20){toast('⚠ '+L('ரகசியக் குறி சரியில்லை','Key looks wrong'),true);return;}
  if(!/^\d{4}$/.test(p1)||p1!==p2){toast('⚠ '+L('PIN 4 இலக்கம், இரண்டும் ஒன்றாக இருக்க வேண்டும்','PIN must be 4 digits and match'),true);return;}
  CFG.key=k;CFG.api=api||CFG.api;busy(true);
  apiCall('ping',[]).then(function(){busy(false);return phash(p1);}).then(function(hs){CFG.pin=hs;CFG.locked=false;CFG.nlDone=tdy();saveCfg();lk.classList.add('hidden');startApp();})
  .catch(function(e){busy(false);var m=String(e.message||e);CFG.key='';showSetup(m==='AUTH'?L('ரகசியக் குறி தவறு','Wrong key'):L('இணைக்க முடியவில்லை: ','Could not connect: ')+m,k);});};}
function showPin(msg){var lk=$('lock'),entry='';lk.classList.remove('hidden');
 function draw(){var d='';for(var i=0;i<4;i++)d+='<i class="'+(i<entry.length?'f':'')+'"></i>';$('pinDots').innerHTML=d;}
 lk.innerHTML='<div style="font-size:44px">🔒</div><h2>'+esc(t('app'))+'</h2><div class="msg" id="pinMsg">'+esc(msg||L('PIN-ஐ உள்ளிடவும்','Enter PIN'))+'</div><div class="dots" id="pinDots"></div><div class="pad">'
  +[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(function(n){return n===''?'<span></span>':'<button data-k="'+n+'">'+n+'</button>';}).join('')+'</div>'+(CFG.bio?'<button class="biob" id="bioBtn">👆 '+L('கைரேகை / போன் பூட்டால் திற','Unlock with fingerprint / screen lock')+'</button>':'')+'<button class="lnk" id="pinForgot">'+L('PIN மறந்துவிட்டதா?','Forgot PIN?')+'</button>';
 draw();
 if(CFG.bio){$('bioBtn').onclick=function(){bioUnlock();};if(!msg)setTimeout(function(){bioUnlock(true);},300);}
 lk.querySelector('.pad').onclick=function(e){var b=e.target.closest('button');if(!b)return;var k=b.getAttribute('data-k');
  if(k==='⌫'){entry=entry.slice(0,-1);draw();return;}if(entry.length>=4)return;entry+=k;draw();
  if(entry.length===4)phash(entry).then(function(hs){if(hs===CFG.pin){unlockOk();}
   else{entry='';draw();$('pinDots').classList.remove('shake');void $('pinDots').offsetWidth;$('pinDots').classList.add('shake');$('pinMsg').textContent=L('PIN தவறு','Wrong PIN');}});};
 $('pinForgot').onclick=function(){showSetup(L('ரகசியக் குறியை மீண்டும் போட்டு புதிய PIN அமைக்கவும்','Enter the key again and set a new PIN'),'');};}
window.onAuthFail=function(){CFG.key='';saveCfg();showSetup(L('ரகசியக் குறி மாற்றப்பட்டுள்ளது — புதிய குறியை உள்ளிடவும்','The key was changed — enter the new key'));};

/* பூட்டு */
function b64e(buf){var s='',a=new Uint8Array(buf);for(var i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s);}
function b64d(str){var s=atob(str),a=new Uint8Array(s.length);for(var i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a;}
function rnd(n){var a=new Uint8Array(n);crypto.getRandomValues(a);return a;}
function lockNow(){if(!CFG.key||!CFG.pin)return;CFG.locked=true;saveCfg();closeSheet();showPin();}
function unlockOk(){CFG.locked=false;saveCfg();$('lock').classList.add('hidden');if(!started)startApp();else{renderChrome();flush();if(S.page==='task'&&S.init)loadTasks();}}
// இரவு தானியங்கிப் பூட்டு (⚙-ல் ON/OFF, நேரம்); அன்று ஒருமுறை மட்டும் — பிறகு திறந்தால் மறுநாள் இரவு வரை பூட்டு இல்லை
function nightCheck(){if(!CFG.key||!CFG.pin||CFG.locked||CFG.nl===false)return false;var d=new Date(),nm=d.getHours()*60+d.getMinutes();
 if(nm>=hm2m(CFG.nlt||'21:00')&&CFG.nlDone!==tdy()){CFG.nlDone=tdy();lockNow();return true;}return false;}
function bioOk(){return !!(window.PublicKeyCredential&&navigator.credentials&&window.crypto&&crypto.getRandomValues);}
function bioUnlock(auto){if(!CFG.bio||!bioOk())return;
 navigator.credentials.get({publicKey:{challenge:rnd(32),allowCredentials:[{type:'public-key',id:b64d(CFG.bio),transports:['internal']}],userVerification:'required',timeout:60000}})
  .then(function(c){if(c)unlockOk();}).catch(function(e){if(!auto){var m=$('pinMsg');if(m)m.textContent=L('கைரேகை வேலை செய்யவில்லை — PIN போடவும்','Fingerprint failed — use PIN');}});}
function bioSetup(){if(!bioOk()){toast('⚠ '+t('bioNo'),true);return;}
 var go2=function(){navigator.credentials.create({publicKey:{challenge:rnd(32),rp:{name:'My Tasks & Accounts'},user:{id:rnd(16),name:'owner',displayName:'My Tasks & Accounts'},
   pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required',residentKey:'discouraged'},timeout:60000}})
  .then(function(c){CFG.bio=b64e(c.rawId);saveCfg();toast(t('bioOn'));loadSet();}).catch(function(e){toast('⚠ '+t('bioFail')+' ('+emsg(e).slice(0,60)+')',true);});};
 if(PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable)PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable().then(function(ok){if(ok)go2();else toast('⚠ '+t('bioNo'),true);}).catch(go2);else go2();}
function pinChange(){openSheet('<div class="shead"><b>🔑 '+t('pinCh')+'</b><button class="x" data-act="close">✕</button></div>'+lab(t('pinOld'))+'<input id="pcOld" class="inp" type="password" inputmode="numeric" maxlength="4">'
 +'<div class="g2"><div>'+lab(t('pinNew'))+'<input id="pcNew" class="inp" type="password" inputmode="numeric" maxlength="4"></div><div>'+lab(t('pinNew2'))+'<input id="pcNew2" class="inp" type="password" inputmode="numeric" maxlength="4"></div></div><button class="save" data-act="pcgo">'+t('lSave')+'</button>');}
function pinChangeGo(){var o=$('pcOld').value,n1=$('pcNew').value,n2=$('pcNew2').value;
 if(!/^\d{4}$/.test(n1)||n1!==n2){toast('⚠ '+L('PIN 4 இலக்கம், இரண்டும் ஒன்றாக இருக்க வேண்டும்','PIN must be 4 digits and match'),true);return;}
 phash(o).then(function(h){if(h!==CFG.pin){toast('⚠ '+L('பழைய PIN தவறு','Old PIN is wrong'),true);return null;}return phash(n1);}).then(function(h2){if(!h2)return;CFG.pin=h2;saveCfg();closeSheet();toast(t('savedOk'));});}
setInterval(nightCheck,30000);
function boot(){var h=location.hash||'';
 if(h.indexOf('#k=')===0){var k=decodeURIComponent(h.slice(3));try{history.replaceState(null,'',location.pathname+location.search);}catch(e){}showSetup(L('புதிய PIN அமைக்கவும்','Set a PIN'),k);return;}
 if(!CFG.key){showSetup('');return;}
 if(CFG.locked&&CFG.pin){showPin();return;}
 if(nightCheck())return;
 startApp();}
window.addEventListener('hashchange',function(){if((location.hash||'').indexOf('#k=')===0)boot();});
if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(function(){});}
